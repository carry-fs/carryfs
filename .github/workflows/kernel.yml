name: kernel

# Builds the kernel driver (linux/) against the kernel headers of several
# distributions, each with the rustc that built its kernel. Weekly too, as
# distributions update their kernels.

on:
  push:
    paths:
      - linux/**
      - ondisk/**
      - scripts/kernel-build.sh
      - .github/workflows/kernel.yml
  pull_request:
    paths:
      - linux/**
      - ondisk/**
      - scripts/kernel-build.sh
      - .github/workflows/kernel.yml
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build (${{ matrix.distro }})
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu-26.04
            image: ubuntu:26.04
            install: |
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates make gcc libc6-dev kmod linux-headers-generic
              version=$(ls -d /usr/src/linux-headers-*-generic | sort -V | tail -1)
              version=${version#/usr/src/linux-headers-}
              apt-get install -y --no-install-recommends "linux-lib-rust-$version"
              # The rustc that built the kernel, which Ubuntu versions as rustc-1.NN.
              rust=$(sed -n 's/^CONFIG_RUSTC_VERSION_TEXT="\{0,1\}rustc \([0-9]*\.[0-9]*\).*/\1/p' \
                "/usr/src/linux-headers-$version/include/config/auto.conf")
              apt-get install -y --no-install-recommends "rustc-$rust"
          - distro: arch
            image: archlinux:latest
            install: pacman -Syu --noconfirm --needed base-devel linux-headers rust pahole
          - distro: fedora
            image: fedora:latest
            install: dnf -y install make gcc gawk binutils kmod kernel-devel rust dwarves
    steps:
      - uses: actions/checkout@v7
      - name: Kernel headers and rustc
        run: ${{ matrix.install }}
      - name: Build
        run: scripts/kernel-build.sh
