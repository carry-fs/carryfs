name: release

on:
  push:
    tags: ["v*"]
  # Build-only smoke test: packaging changes show up before a tag does.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - RELEASE_NOTES.md
      - packaging/**
      - fuse/packaging/**
      - windows/packaging/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 24.04 sets the glibc baseline that install.sh enforces.
          - os: ubuntu-24.04
            platform: linux-x86_64
            packages: -p carryfs-core -p carryfs-fuse
          - os: macos-latest
            platform: macos-arm64
            packages: -p carryfs-core -p carryfs-fuse -p carryfs-macos
          - os: windows-latest
            platform: windows-x86_64
            packages: -p carryfs-core -p carryfs-windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"; exit 1; }
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Build
        run: cargo build --release --locked ${{ matrix.packages }}
      - name: Stage
        run: packaging/stage-release.sh ${{ matrix.platform }} payload
      - uses: actions/upload-artifact@v7
        with:
          name: payload-${{ matrix.platform }}
          path: payload
          if-no-files-found: error
      # The manager ships beside the adapter; the installers do not install it.
      # It runs its companion carryfs from its own directory.
      - name: Linux manager libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev
      - name: Build and stage manager
        run: |
          set -euo pipefail
          mkdir manager-payload
          release=manager/target/release
          case ${{ matrix.platform }} in
            macos-arm64)
              cp -R "$(manager/scripts/bundle-macos.sh)" manager-payload/ ;;
            windows-x86_64)
              cargo build --release --locked --manifest-path manager/Cargo.toml --bins
              cp "$release/carryfs-manager.exe" "$release/carryfs.exe" manager-payload/ ;;
            *)
              cargo build --release --locked --manifest-path manager/Cargo.toml --bins
              cp "$release/carryfs-manager" "$release/carryfs" manager-payload/ ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: manager-${{ matrix.platform }}
          path: manager-payload
          if-no-files-found: error

  freebsd:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '14.5'
            architecture: x86-64
            platform: freebsd14-x86_64
          - version: '14.5'
            architecture: arm64
            platform: freebsd14-arm64
          - version: '15.1'
            architecture: x86-64
            platform: freebsd15-x86_64
          - version: '15.1'
            architecture: arm64
            platform: freebsd15-arm64
    steps:
      - uses: actions/checkout@v7
      - name: FreeBSD VM
        uses: cross-platform-actions/action@ef53f0d3fd471648f2758f3fcdc3cb2aa40c87cb # v1.7.0
        with:
          operating_system: freebsd
          architecture: ${{ matrix.architecture }}
          version: ${{ matrix.version }}
      - name: Build and stage
        shell: cpa.sh {0}
        run: |
          sudo pkg install -y rust bash
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
            [ "$GITHUB_REF_NAME" = "v$version" ]
          fi
          cargo build --release --locked -p carryfs-core -p carryfs-fuse
          bash packaging/stage-release.sh ${{ matrix.platform }} payload
      - uses: actions/upload-artifact@v7
        with:
          name: payload-${{ matrix.platform }}
          path: payload
          if-no-files-found: error

  netbsd:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '10.2'
            platform: netbsd10-x86_64
          - version: '11.1'
            platform: netbsd11-x86_64
    steps:
      - uses: actions/checkout@v7
      - name: NetBSD VM
        uses: cross-platform-actions/action@82668f1fbd89d9c99487604f822cbf6716f124d3 # v1.7.0
        with:
          operating_system: netbsd
          # The action default image bundle predates NetBSD 11.1.
          image_url: https://github.com/cross-platform-actions/netbsd-builder/releases/download/v1.3.0/netbsd-${{ matrix.version }}-x86-64.tar.zst
          architecture: x86-64
          version: ${{ matrix.version }}
      - name: Build and stage
        shell: cpa.sh {0}
        run: |
          export PATH="$HOME/.cargo/bin:/usr/pkg/bin:/usr/pkg/sbin:/sbin:/usr/sbin:$PATH"
          curl -fsSL -o /tmp/rustup-init https://static.rust-lang.org/rustup/dist/x86_64-unknown-netbsd/rustup-init
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
            [ "$GITHUB_REF_NAME" = "v$version" ]
          fi
          cargo build --release --locked -p carryfs-core -p carryfs-fuse
          bash packaging/stage-release.sh ${{ matrix.platform }} payload
      - uses: actions/upload-artifact@v7
        with:
          name: payload-${{ matrix.platform }}
          path: payload
          if-no-files-found: error

  # The APK is debug-signed (RELEASE_NOTES.md).
  android:
    uses: ./.github/workflows/android.yml

  kernel:
    uses: ./.github/workflows/kernel.yml

  # Archives are built on Linux so the Windows zip has forward-slash entries,
  # which install.ps1 requires.
  package:
    needs: [build, freebsd, netbsd, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: payloads
      - name: Archive
        run: |
          set -euo pipefail
          version=$(cat payloads/payload-linux-x86_64/VERSION)
          mkdir dist
          for platform in linux-x86_64 macos-arm64 freebsd14-x86_64 freebsd14-arm64 freebsd15-x86_64 freebsd15-arm64 netbsd10-x86_64 netbsd11-x86_64; do
            [ "$(cat payloads/payload-$platform/VERSION)" = "$version" ]
            tar --owner=0 --group=0 --numeric-owner -czf "dist/carryfs-$version-$platform.tar.gz" -C "payloads/payload-$platform" .
          done
          [ "$(cat payloads/payload-windows-x86_64/VERSION)" = "$version" ]
          (cd payloads/payload-windows-x86_64 && zip -qrX "$GITHUB_WORKSPACE/dist/carryfs-$version-windows-x86_64.zip" .)
          for platform in linux-x86_64 macos-arm64; do
            tar --owner=0 --group=0 --numeric-owner -czf "dist/carryfs-manager-$version-$platform.tar.gz" -C "payloads/manager-$platform" .
          done
          (cd payloads/manager-windows-x86_64 && zip -qrX "$GITHUB_WORKSPACE/dist/carryfs-manager-$version-windows-x86_64.zip" .)
          cp payloads/android-apk/app-debug.apk "dist/carryfs-$version-android-arm64.apk"
          # The module builds per kernel, so it ships as source: linux/ includes ondisk/src,
          # and scripts/kernel-build.sh finds the rustc that built the kernel.
          git archive --prefix="carryfs-$version-linux-module/" -o "dist/carryfs-$version-linux-module-src.tar.gz" HEAD \
            linux ondisk scripts/kernel-build.sh LICENSE LICENSE-APACHE LICENSE-GPL-2.0
          (cd dist && sha256sum carryfs-* > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package, kernel]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # A hyphen in the tag marks a SemVer prerelease such as v0.1.0-rc.1.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flag=
          case $GITHUB_REF_NAME in *-*) flag=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md $flag

  publish-index:
    needs: release
    uses: ./.github/workflows/publish-scripts.yml
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
