[package]
name = "carryfs-core"
version.workspace = true
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0 OR GPL-2.0-only"
description = "CarryFS image commit engine"

[workspace]
members = [".", "ondisk", "fuse", "macos", "windows", "android/native"]
exclude = ["fuzz", "manager"]

# The product version: every crate, package, and tag shares it (VERSIONING.md).
[workspace.package]
version = "0.2.0"

[dependencies]
carryfs-ondisk = { path = "ondisk", features = ["std"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "netbsd", target_os = "macos"))'.dependencies]
libc = "0.2"

[[bin]]
name = "carryfs"
path = "src/main.rs"

[[bin]]
name = "fsck-carryfs"
path = "src/fsck_main.rs"

[[bench]]
name = "core"
harness = false

[[bench]]
name = "recovery"
harness = false

[[bench]]
name = "ondisk"
harness = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[features]
fuzzing = []

# The exhaustive crash matrix took 110 seconds without optimization.
[profile.test]
opt-level = 1
overflow-checks = true
debug-assertions = true

# 2-5% faster metadata reads, 2x build time.
[profile.release]
lto = "fat"
codegen-units = 1

# The fork is upstream fuser master plus a spin budget for the event loop
# (`Config::spin`) and `before_destroy`, which runs only on FUSE_DESTROY.
# Upstream's `destroy` also runs when the session ends without one, after a
# fuseblk mount may have released its device, so it cannot publish safely.
# Return to upstream once it covers both.
[patch.crates-io]
fuser = { git = "https://github.com/carry-fs/fuser", branch = "master" }
