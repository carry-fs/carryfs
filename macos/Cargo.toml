[package]
name = "carryfs-macos"
version = "0.1.0-rc.1"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0 OR GPL-2.0-only"
description = "CarryFS disk discovery, format, and check helpers for macOS"
publish = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[[bin]]
# Cargo forbids a dot in a crate name; fuse/packaging/macos-bundle.sh installs
# it into carryfs.fs as carryfs.util, the name DiskArbitration runs.
name = "carryfs-util"
path = "src/util.rs"

# storagekitd runs these from the carryfs.fs bundle for diskutil and Disk Utility.
[[bin]]
name = "newfs_carryfs"
path = "src/newfs.rs"

[[bin]]
name = "fsck_carryfs"
path = "src/fsck.rs"

[dependencies]
carryfs-core = { path = ".." }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
