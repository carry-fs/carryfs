[package]
name = "carryfs-manager"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0 OR GPL-2.0-only"
default-run = "carryfs-manager"

[workspace]

[dependencies]
carryfs-core = { path = ".." }
serde_json = "1"
rune = { git = "https://github.com/anomalyco/rune", rev = "0d00d3f2d59df5b764d8d6b2585164fd43c16f48", default-features = false, features = ["accessibility", "embedded-fonts", "metal-backend", "native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "0d00d3f2d59df5b764d8d6b2585164fd43c16f48" }

# The companion `carryfs` binary builds the root src/main.rs, which needs the
# root crate's libc on these systems.
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "netbsd", target_os = "macos"))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "0d00d3f2d59df5b764d8d6b2585164fd43c16f48" }
winit = { git = "https://github.com/anomalyco/rune", rev = "0d00d3f2d59df5b764d8d6b2585164fd43c16f48" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "0d00d3f2d59df5b764d8d6b2585164fd43c16f48" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "0d00d3f2d59df5b764d8d6b2585164fd43c16f48" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "0d00d3f2d59df5b764d8d6b2585164fd43c16f48" }

[profile.dev]
debug = 1

[profile.test]
debug = 1

[[bin]]
name = "carryfs"
path = "../src/main.rs"
